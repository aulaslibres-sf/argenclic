<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="105" viewBox="0 0 300 105" role="img" aria-label="Enlace a Proyecto JClic">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="s" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Badge -->
  <g filter="url(#s)">
    <rect x="8" y="8" width="284" height="89" rx="18" fill="url(#g)"/>
    <!-- subtle highlight -->
    <path d="M16,24 C90,6 210,6 284,24" fill="none" stroke="white" stroke-opacity="0.18" stroke-width="8"/>
  </g>

  <!-- Sun icon (right) -->
  <g transform="translate(238,28)">
    <circle cx="18" cy="18" r="12" fill="#fbbf24"/>
    <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
      <line x1="18" y1="-2" x2="18" y2="6"/>
      <line x1="18" y1="30" x2="18" y2="38"/>
      <line x1="-2" y1="18" x2="6" y2="18"/>
      <line x1="30" y1="18" x2="38" y2="18"/>
      <line x1="4" y1="4" x2="10" y2="10"/>
      <line x1="26" y1="26" x2="32" y2="32"/>
      <line x1="4" y1="32" x2="10" y2="26"/>
      <line x1="26" y1="10" x2="32" y2="4"/>
    </g>
  </g>

  <!-- Text -->
  <g font-family="Inter, Poppins, 'Segoe UI', Arial, sans-serif">
    <text x="24" y="44" font-size="22" fill="#bfdbfe" letter-spacing="2">PROYECTO</text>
    <text x="24" y="76" font-size="44" font-weight="800" fill="#a3e635" stroke="#065f46" stroke-width="2" paint-order="stroke">
      JClic
    </text>
  </g>

  <!-- URL (small) -->
  <text x="24" y="96" font-size="11" fill="#e5e7eb" font-family="Inter, Poppins, 'Segoe UI', Arial, sans-serif">
    servidor.aulaslibres.ar/projects
  </text>
</svg>
