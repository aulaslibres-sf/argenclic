<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="107" height="300" viewBox="0 0 107 300" role="img" aria-label="Enlace vertical a Proyecto JClic">
  <defs>
    <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="sv" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Vertical badge -->
  <g filter="url(#sv)">
    <rect x="9" y="8" width="89" height="284" rx="20" fill="url(#gv)"/>
    <path d="M18,34 C36,22 71,22 89,34" fill="none" stroke="white" stroke-opacity="0.18" stroke-width="8"/>
  </g>

  <!-- Sun icon (top) -->
  <g transform="translate(36,26)">
    <circle cx="17.5" cy="17.5" r="11.5" fill="#fbbf24"/>
    <g stroke="#fbbf24" stroke-width="2.8" stroke-linecap="round">
      <line x1="17.5" y1="-1" x2="17.5" y2="6"/>
      <line x1="17.5" y1="29" x2="17.5" y2="36"/>
      <line x1="-1" y1="17.5" x2="6" y2="17.5"/>
      <line x1="29" y1="17.5" x2="36" y2="17.5"/>
      <line x1="3" y1="3" x2="9" y2="9"/>
      <line x1="26" y1="26" x2="32" y2="32"/>
      <line x1="3" y1="32" x2="9" y2="26"/>
      <line x1="26" y1="9" x2="32" y2="3"/>
    </g>
  </g>

  <!-- Vertical text -->
  <g font-family="Inter, Poppins, 'Segoe UI', Arial, sans-serif">
    <text transform="rotate(-90 20 240)" x="20" y="240" font-size="18" fill="#bfdbfe" letter-spacing="2">PROYECTO</text>
    <text transform="rotate(-90 40 260)" x="40" y="260" font-size="50" font-weight="800" fill="#a3e635" stroke="#065f46" stroke-width="2" paint-order="stroke">JClic</text>
  </g>

  <!-- URL (bottom) -->
  <text x="16" y="288" font-size="10.5" fill="#e5e7eb" font-family="Inter, Poppins, 'Segoe UI', Arial, sans-serif">
    servidor.aulaslibres.ar/projects
  </text>
</svg>
